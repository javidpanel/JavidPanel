name: Bug report
description: Report a reproducible JavidPanel issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not paste API tokens, passwords, secure paths, subscription links or other secrets."
  - type: input
    id: version
    attributes:
      label: JavidPanel version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - JavidPanel Worker
        - Admin panel
        - Subscriber panel
        - Telegram Installer
        - Update system
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all tokens, passwords, account IDs and subscription URLs.
