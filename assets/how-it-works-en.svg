<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0f2742"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1687ff"/><stop offset="1" stop-color="#18c7d9"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".28"/></filter></defs>
<title id="title">How JavidPanel works</title><desc id="desc">User, official bot, Cloudflare, JavidPanel and subscription flow</desc>
<rect width="1400" height="480" rx="30" fill="url(#bg)"/>
<text x="700" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">How JavidPanel works</text>
<text x="700" y="108" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#9fb6cc">A simple path from installation to everyday management</text>
<g filter="url(#shadow)">
<rect x="70" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="180" cy="220" r="28" fill="url(#accent)"/><text x="180" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">1</text><text x="180" y="278" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#fff">User</text><text x="180" y="307" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#9fb6cc">Starts installation</text>
<rect x="330" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="440" cy="220" r="28" fill="url(#accent)"/><text x="440" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">2</text><text x="440" y="278" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#fff">Official Bot</text><text x="440" y="307" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#9fb6cc">Guided setup</text>
<rect x="590" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="700" cy="220" r="28" fill="url(#accent)"/><text x="700" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">3</text><text x="700" y="278" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#fff">Cloudflare</text><text x="700" y="307" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#9fb6cc">Selected account</text>
<rect x="850" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="960" cy="220" r="28" fill="url(#accent)"/><text x="960" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">4</text><text x="960" y="278" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#fff">JavidPanel</text><text x="960" y="307" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#9fb6cc">Panel & user control</text>
<rect x="1110" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="1220" cy="220" r="28" fill="url(#accent)"/><text x="1220" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">5</text><text x="1220" y="278" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#fff">Subscription</text><text x="1220" y="307" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#9fb6cc">Link & client</text>
</g>
