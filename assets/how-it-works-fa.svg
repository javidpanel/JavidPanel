<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0f2742"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1687ff"/><stop offset="1" stop-color="#18c7d9"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".28"/></filter></defs>
<title id="title">سازوکار کلی جاویدپنل</title><desc id="desc">از کاربر تا ربات رسمی، Cloudflare، جاویدپنل و اشتراک</desc>
<rect width="1400" height="480" rx="30" fill="url(#bg)"/>
<text x="700" y="72" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">جاویدپنل چگونه کار می‌کند؟</text>
<text x="700" y="108" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#9fb6cc">یک مسیر ساده برای نصب، مدیریت و استفاده روزمره</text>
<g filter="url(#shadow)">
<rect x="70" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="180" cy="220" r="28" fill="url(#accent)"/><text x="180" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">1</text><text x="180" y="278" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="22" font-weight="700" fill="#fff">کاربر</text><text x="180" y="307" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="15" fill="#9fb6cc">شروع نصب</text>
<rect x="330" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="440" cy="220" r="28" fill="url(#accent)"/><text x="440" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">2</text><text x="440" y="278" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="22" font-weight="700" fill="#fff">ربات رسمی</text><text x="440" y="307" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="15" fill="#9fb6cc">راهنمای مرحله‌به‌مرحله</text>
<rect x="590" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="700" cy="220" r="28" fill="url(#accent)"/><text x="700" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">3</text><text x="700" y="278" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">Cloudflare</text><text x="700" y="307" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="15" fill="#9fb6cc">حساب انتخاب‌شده کاربر</text>
<rect x="850" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="960" cy="220" r="28" fill="url(#accent)"/><text x="960" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">4</text><text x="960" y="278" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="22" font-weight="700" fill="#fff">جاویدپنل</text><text x="960" y="307" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="15" fill="#9fb6cc">مدیریت پنل و کاربران</text>
<rect x="1110" y="180" width="220" height="150" rx="24" fill="#0f2135" stroke="#27445f"/><circle cx="1220" cy="220" r="28" fill="url(#accent)"/><text x="1220" y="229" text-anchor="middle" font-family="Arial" font-size="26" fill="#fff">5</text><text x="1220" y="278" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="22" font-weight="700" fill="#fff">اشتراک</text><text x="1220" y="307" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="15" fill="#9fb6cc">لینک و کلاینت کاربر</text>
</g>
<g stroke="#4a6b86" stroke-width="3" fill="none"><path d="M290 255H330"/><path d="M550 255H590"/><path d="M810 255H850"/><path d="M1070 255H1110"/></g>
<g fill="#18c7d9"><path d="M323 248l12 7-12 7z"/><path d="M583 248l12 7-12 7z"/><path d="M843 248l12 7-12 7z"/><path d="M1103 248l12 7-12 7z"/></g>
<text x="700" y="410" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial" font-size="17" fill="#c5d7e8">نصب و نگهداری از مسیر رسمی پروژه انجام می‌شود؛ مدیریت روزمره از پنل و ربات در دسترس است.</text>
</svg>